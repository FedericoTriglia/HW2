<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW2 — Public-Key Cryptography in Ethereum</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1e293b;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #38bdf8;
        }
        .download-btn {
            background-color: #0284c7;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .download-btn:hover {
            background-color: #0369a1;
        }
        .viewer-container {
            flex: 1;
            width: 100%;
            background-color: #334155;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .fallback {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>HW2 — Public-Key Cryptography in Ethereum</h1>
        <a href="HW2.pdf" download class="download-btn">Scarica PDF</a>
    </header>

    <div class="viewer-container">
        <iframe src="HW2.pdf" type="application/pdf">
            <div class="fallback">
                <p>Il tuo browser non supporta la visualizzazione diretta dei PDF.</p>
                <p><a href="HW2.pdf" style="color: #38bdf8;">Clicca qui per scaricare il file PDF.</a></p>
            </div>
        </iframe>
    </div>

</body>
</html>
